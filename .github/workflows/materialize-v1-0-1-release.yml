name: Materialize Rename Manager v1.0.1 release

on:
  push:
    branches:
      - release-v1.0.1
    paths:
      - '.github/workflows/materialize-v1-0-1-release.yml'
      - 'tools/build_v1_0_1_release.py'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build final release source and ZIP
        run: python tools/build_v1_0_1_release.py

      - name: Materialize exact release source
        shell: bash
        run: |
          set -euo pipefail
          STAGE='build-release/Rename Manager'
          rm -rf data renamemanager 'SirLocksley Parchment Controls Core [SubMod]'
          cp -a "$STAGE/data" ./data
          cp -a "$STAGE/renamemanager" ./renamemanager
          cp -a "$STAGE/SirLocksley Parchment Controls Core [SubMod]" './SirLocksley Parchment Controls Core [SubMod]'
          cp "$STAGE/modinfo.json" ./modinfo.json
          cp "$STAGE/README.md" ./README.md
          cp "$STAGE/CHANGELOG.md" ./CHANGELOG.md

          # Keep the final release branch clean: development-only builders,
          # temporary workflows and planning files are not part of release source.
          rm -rf tools .github docs build-test2 build-release

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Release Rename Manager v1.0.1'
          git push origin HEAD:release-v1.0.1
